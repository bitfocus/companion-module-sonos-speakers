name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn package
      - uses: actions/upload-artifact@v4
        with:
          name: module-package
          path: '*.tgz'
